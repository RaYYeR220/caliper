<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caliper — trial pre-screening</title>
<meta name="description"
      content="Criteria review, screening queue and screening packets for one trial site.">

<!-- Inline, because a browser asks for /favicon.ico whether or not you meant it to, and a 404 in
     the console of a page whose claim is "no external request" is the one error a reader checking
     that claim will find. Data URI rather than a file, so it stays true. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231b1b1f'/%3E%3Cpath d='M4 4v8M12 4v8M4 8h8' stroke='%23f5f5f2' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">

<!--
  Plain HTML, one stylesheet and ES modules. No bundler, no package manager, no CDN, no web font,
  no framework, and nothing to compile before this page runs.

  That is a decision rather than an omission. Every dependency is a thing that can fail in front of
  the person you are showing the work to: a lockfile that will not resolve, a CDN that is blocked on
  the hospital network, a build that needs a Node version nobody has. This page is served by
  `python -m http.server` from this directory and reads JSON that `caliper ui demo` wrote next to
  it, so the only way it can fail is if the data is wrong — which is the failure worth seeing.
-->

<link rel="stylesheet" href="styles.css">
<script type="module" src="app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="chrome" id="chrome"></header>

<main id="main" tabindex="-1">
  <noscript>
    <div class="notice">
      <h1>This page needs JavaScript</h1>
      <p>
        Caliper's interface reads the exported run out of <code>data/</code> and renders it in the
        browser. The printed packet, which needs nothing at all, is produced by
        <code>caliper screen --packet</code>.
      </p>
    </div>
  </noscript>
</main>

<div id="live" role="status" aria-live="polite" class="visually-hidden"></div>
</body>
</html>
