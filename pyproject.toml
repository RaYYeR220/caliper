[project]
name = "caliper"
version = "0.1.0"
description = "Evidence-bound pre-screening of patients against clinical trial eligibility criteria."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    "jinja2>=3.1",
    "python-dateutil>=2.9",
    "openai>=1.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-recording>=0.13.4",
    "vcrpy>=8.3.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
caliper = "caliper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caliper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer's whole calling convention is function calls in argument defaults.
"src/caliper/cli.py" = ["B008"]
"src/caliper/evalcmd.py" = ["B008"]
"src/caliper/uicmd.py" = ["B008"]
"src/caliper/trajcmd.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["caliper"]
known-local-folder = ["fakes"]

[tool.mypy]
python_version = "3.12"
strict = true
